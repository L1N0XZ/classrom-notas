<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Classroom · Mis Notas</title>
<style>
  :root{
    --paper:#F6F4EC;
    --ink:#20221D;
    --ink-soft:#5B5D53;
    --card-dark:#23241F;
    --green:#2F7A55;
    --green-deep:#1F5B3E;
    --green-pale:#DCEEE1;
    --mustard:#C99A2E;
    --line:#DAD6C6;
    --radius:20px;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    background:#EAE6D8;
    font-family:"Söhne","Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    color:var(--ink);
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100%;
    padding:32px 16px;
  }
  .stage{
    width:100%;
    max-width:400px;
  }
  .caption{
    text-align:center;
    font-size:13px;
    color:#8a8672;
    margin-bottom:10px;
    letter-spacing:.01em;
  }
  .phone{
    background:var(--paper);
    border-radius:38px;
    border:1px solid var(--line);
    box-shadow:0 30px 60px -25px rgba(20,20,10,.35);
    height:720px;
    max-height:82vh;
    overflow:hidden;
    position:relative;
  }
  .screens{
    height:100%;
    width:100%;
    position:relative;
  }
  .screen{
    position:absolute;
    inset:0;
    padding:26px 20px 22px;
    display:flex;
    flex-direction:column;
    overflow-y:auto;
    transition:transform .38s cubic-bezier(.32,.72,.35,1), opacity .3s ease;
  }
  .screen::-webkit-scrollbar{display:none;}

  /* screen stacking / transitions */
  .screen[data-active="false"][data-dir="forward"]{transform:translateX(-18%);opacity:0;pointer-events:none;}
  .screen[data-active="false"][data-dir="back"]{transform:translateX(100%);opacity:0;pointer-events:none;}
  .screen[data-active="true"]{transform:translateX(0);opacity:1;}

  .topbar{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:22px;
    min-height:40px;
  }
  .back-btn{
    width:40px;height:40px;border-radius:50%;
    background:var(--green);
    border:none;color:#fff;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;flex:0 0 auto;
    transition:background .15s ease, transform .15s ease;
  }
  .back-btn:hover{background:var(--green-deep);}
  .back-btn:active{transform:scale(.92);}
  .back-btn svg{width:18px;height:18px;}

  h1.title{
    font-size:19px;
    font-weight:700;
    margin:0;
    line-height:1.25;
  }
  .title-icon{margin-left:2px;}

  .subtitle{
    font-size:13px;
    color:var(--ink-soft);
    margin:0 0 18px;
  }

  .panel{
    background:var(--card-dark);
    color:#fff;
    border-radius:16px;
    padding:16px 18px;
    margin-bottom:14px;
  }
  .panel .label{
    font-size:11px;
    color:#B8BBAF;
    margin-bottom:4px;
  }
  .panel .value{
    font-size:22px;
    font-weight:700;
  }
  .panel.button{
    display:flex;align-items:center;justify-content:space-between;
    cursor:pointer;border:none;width:100%;text-align:left;
    font-family:inherit;font-size:15px;font-weight:600;color:#fff;
    transition:background .15s ease;
  }
  .panel.button:hover{background:#2c2e26;}
  .panel.button .chev{color:#9aa08c;}

  .section-label{
    font-size:12px;
    font-weight:700;
    color:var(--ink-soft);
    margin:6px 2px 10px;
  }

  .grid2{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    margin-bottom:6px;
  }
  .subject-card{
    background:var(--green);
    color:#fff;
    border-radius:16px;
    padding:16px 14px 40px;
    border:none;
    cursor:pointer;
    text-align:left;
    font-family:inherit;
    position:relative;
    min-height:96px;
    transition:transform .15s ease, background .15s ease;
  }
  .subject-card:hover{background:var(--green-deep);}
  .subject-card:active{transform:scale(.97);}
  .subject-card .name{font-weight:700;font-size:15px;display:block;}
  .subject-card .icon{position:absolute;bottom:12px;right:14px;font-size:20px;}

  .row-card{
    background:var(--green);
    color:#fff;
    border:none;
    border-radius:14px;
    padding:16px 18px;
    margin-bottom:10px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    width:100%;
    font-family:inherit;
    cursor:pointer;
    transition:background .15s ease, transform .15s ease;
  }
  .row-card:hover{background:var(--green-deep);}
  .row-card:active{transform:scale(.98);}
  .row-card .subject{font-size:13px;font-weight:700;letter-spacing:.02em;}
  .row-card .grade{font-size:15px;font-weight:700;}

  .spacer{flex:1;}

  .cta{
    margin-top:auto;
    background:var(--green);
    color:#fff;
    border:none;
    border-radius:16px;
    padding:18px 20px;
    font-family:inherit;
    font-size:16px;
    font-weight:700;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    cursor:pointer;
    transition:background .15s ease, transform .15s ease;
  }
  .cta:hover{background:var(--green-deep);}
  .cta:active{transform:scale(.98);}

  .eval-table{
    background:var(--card-dark);
    border-radius:16px;
    padding:18px 18px 6px;
    margin-bottom:16px;
  }
  .eval-head{
    display:flex;
    justify-content:space-between;
    font-size:12px;
    font-weight:700;
    color:#B8BBAF;
    padding-bottom:10px;
    border-bottom:1px solid #34362d;
    margin-bottom:8px;
  }
  .eval-row{
    display:flex;
    justify-content:space-between;
    padding:8px 0;
    font-size:14px;
    color:#EDEDE4;
    border-bottom:1px solid #2c2e26;
  }
  .eval-row:last-child{border-bottom:none;}
  .eval-row .grade{font-weight:700;color:#fff;}

  .final{
    background:var(--mustard);
    color:#241C05;
    border-radius:16px;
    padding:16px 18px;
    font-weight:700;
    font-size:16px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:auto;
  }
</style>
</head>
<body>

<div class="stage">
  <p class="caption">Prototipo interactivo — toca para navegar</p>
  <div class="phone">
    <div class="screens" id="screens"></div>
  </div>
</div>

<script>
/* ---------- datos ---------- */
const subjects = {
  matematica: { name:"Matemática", icon:"📐", grade:6.7, evaluations:[
    {name:"Prueba 1", grade:6.5},
    {name:"Tarea 1", grade:7.0},
    {name:"Prueba 2", grade:6.3},
    {name:"Trabajo", grade:7.0},
  ]},
  lenguaje: { name:"Lenguaje", icon:"📖", grade:6.4, evaluations:[
    {name:"Prueba 1", grade:6.0},
    {name:"Ensayo", grade:6.8},
    {name:"Prueba 2", grade:6.2},
    {name:"Disertación", grade:6.6},
  ]},
  historia: { name:"Historia", icon:"🏛️", grade:6.2, evaluations:[
    {name:"Prueba 1", grade:5.8},
    {name:"Trabajo grupal", grade:6.5},
    {name:"Prueba 2", grade:6.1},
    {name:"Guía", grade:6.4},
  ]},
  ciencias: { name:"Ciencias", icon:"🔬", grade:6.6, evaluations:[
    {name:"Laboratorio 1", grade:6.7},
    {name:"Prueba 1", grade:6.4},
    {name:"Informe", grade:6.9},
    {name:"Prueba 2", grade:6.4},
  ]},
  ingles: { name:"Inglés", icon:"🇬🇧", grade:6.5, evaluations:[
    {name:"Listening", grade:6.6},
    {name:"Prueba 1", grade:6.3},
    {name:"Speaking", grade:6.8},
    {name:"Prueba 2", grade:6.3},
  ]},
};
const promedioGeneral = (
  Object.values(subjects).reduce((s,x)=>s+x.grade,0) / Object.keys(subjects).length
).toFixed(1);

/* ---------- navegación ---------- */
let stack = ["home"]; // pila de pantallas
let currentSubject = null;

const screensEl = document.getElementById("screens");

function go(screen, opts={}){
  if(opts.subject) currentSubject = opts.subject;
  stack.push(screen);
  render("forward");
}
function goBack(){
  if(stack.length > 1){
    stack.pop();
    render("back");
  }
}

function backButton(){
  return `<button class="back-btn" onclick="goBack()" aria-label="Volver">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <line x1="19" y1="12" x2="5" y2="12"></line>
      <polyline points="12 19 5 12 12 5"></polyline>
    </svg>
  </button>`;
}

function screenHome(){
  const cards = Object.entries(subjects).filter(([key])=>key!=="ingles").map(([key,s])=>`
    <button class="subject-card" onclick="go('detail',{subject:'${key}'})">
      <span class="name">${s.name}</span>
      <span class="icon">${s.icon}</span>
    </button>
  `).join("");
  return `
    <div class="topbar">
      <h1 class="title">Classroom <span class="title-icon">🧑‍🎓📚</span></h1>
    </div>
    <button class="panel button" style="margin-bottom:22px;" onclick="go('notas')">
      Mis asignaturas
      <span class="chev">›</span>
    </button>
    <p class="section-label">Asignaturas</p>
    <div class="grid2">${cards}</div>
    <button class="cta" onclick="go('notas')">Mis Notas 📊</button>
  `;
}

function screenNotas(){
  const rows = Object.entries(subjects).map(([key,s])=>`
    <button class="row-card" onclick="go('detail',{subject:'${key}'})">
      <span class="subject">${s.name.toUpperCase()}</span>
      <span class="grade">${s.grade.toFixed(1).replace('.',',')}</span>
    </button>
  `).join("");
  return `
    <div class="topbar">
      ${backButton()}
      <h1 class="title">Mis notas</h1>
    </div>
    <div class="panel">
      <div class="label">PROMEDIO GENERAL</div>
      <div class="value">${promedioGeneral.replace('.',',')}</div>
    </div>
    <p class="section-label">Mis asignaturas</p>
    ${rows}
  `;
}

function screenDetail(){
  const s = subjects[currentSubject];
  const evalRows = s.evaluations.map(e=>`
    <div class="eval-row">
      <span>${e.name}</span>
      <span class="grade">${e.grade.toFixed(1).replace('.',',')}</span>
    </div>
  `).join("");
  return `
    <div class="topbar">
      ${backButton()}
      <h1 class="title">${s.name} <span class="title-icon">${s.icon}</span></h1>
    </div>
    <div class="panel">
      <div class="label">PROMEDIO</div>
      <div class="value">${s.grade.toFixed(1).replace('.',',')}</div>
    </div>
    <p class="section-label">Evaluaciones</p>
    <div class="eval-table">
      <div class="eval-head"><span>Evaluación</span><span>Nota</span></div>
      ${evalRows}
    </div>
    <div class="final">
      <span>Promedio final</span>
      <span>${s.grade.toFixed(1).replace('.',',')}</span>
    </div>
  `;
}

const renderers = { home:screenHome, notas:screenNotas, detail:screenDetail };

function render(dir="forward"){
  screensEl.innerHTML = "";
  stack.forEach((name, i)=>{
    const isActive = i === stack.length - 1;
    const div = document.createElement("div");
    div.className = "screen";
    div.setAttribute("data-active", isActive ? "true":"false");
    div.setAttribute("data-dir", dir);
    div.innerHTML = renderers[name]();
    screensEl.appendChild(div);
  });
}

render();
</script>
</body>
</html>
